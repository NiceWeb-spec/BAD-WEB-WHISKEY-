<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوت استنساخ المواقع</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(145deg, #0b0e1a 0%, #141a2b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .glass-card { max-width: 820px; width: 100%; background: rgba(20, 28, 48, 0.75); backdrop-filter: blur(14px); border-radius: 48px; padding: 2.5rem 2.8rem; box-shadow: 0 30px 50px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.03); }
        @media (max-width: 550px) { .glass-card { padding: 2rem 1.5rem; border-radius: 32px; } }
        .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 2rem; }
        .logo-icon { background: linear-gradient(135deg, #00d2ff, #3a7bd5); width: 54px; height: 54px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; box-shadow: 0 10px 20px -5px rgba(0,150,255,0.3); }
        .logo-text { color: white; font-weight: 700; font-size: 1.8rem; letter-spacing: -0.5px; }
        .logo-text span { background: linear-gradient(to right, #a0d0ff, #4c9aff); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .sub-badge { background: rgba(255,255,255,0.06); padding: 0.3rem 1rem; border-radius: 40px; font-size: 0.75rem; color: #9bb9e6; border: 1px solid rgba(255,255,255,0.04); margin-right: auto; }
        .welcome-message { background: rgba(0,180,255,0.06); border-radius: 28px; padding: 1.4rem 1.8rem; margin: 1.5rem 0 2rem 0; border-right: 4px solid #2f8cff; color: #d3e6ff; font-size: 1rem; line-height: 1.7; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02); }
        .welcome-message i { color: #4c9aff; margin-left: 8px; }
        .input-group { display: flex; flex-wrap: wrap; gap: 12px; margin: 1.8rem 0 1.2rem 0; }
        .input-group input { flex: 1; min-width: 200px; padding: 16px 22px; border-radius: 60px; border: none; background: rgba(255,255,255,0.05); backdrop-filter: blur(4px); color: #ecf3ff; font-size: 1rem; border: 1px solid rgba(255,255,255,0.06); transition: 0.25s; outline: none; }
        .input-group input::placeholder { color: #7e93b0; }
        .input-group input:focus { border-color: #3a86ff; background: rgba(255,255,255,0.08); box-shadow: 0 0 0 4px rgba(58,134,255,0.15); }
        .btn-primary { background: linear-gradient(135deg, #2f7cff, #1a4eff); border: none; padding: 16px 32px; border-radius: 60px; color: white; font-weight: 600; font-size: 1rem; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.2s; box-shadow: 0 8px 24px -6px rgba(30,100,255,0.25); border: 1px solid rgba(255,255,255,0.1); }
        .btn-primary:hover { transform: scale(1.02); background: linear-gradient(135deg, #4088ff, #2a5eff); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .status-box { background: rgba(0,0,0,0.25); border-radius: 24px; padding: 1.2rem 1.6rem; margin: 1.5rem 0 1rem 0; min-height: 72px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border: 1px solid rgba(255,255,255,0.02); }
        .status-box .spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.04); border-top: 3px solid #3b82f6; border-radius: 50%; animation: spin 0.9s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { color: #c7dbf5; font-size: 0.95rem; flex: 1; }
        .status-text i { margin-left: 10px; }
        .status-box .progress-bar { width: 100%; height: 4px; background: #1f2a44; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .status-box .progress-bar .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2f7cff, #36d399); border-radius: 10px; transition: width 0.5s ease; }
        .log-area { background: #0b0e1a; border-radius: 16px; padding: 0.8rem 1.2rem; margin-top: 0.8rem; max-height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; color: #8bb3f0; border: 1px solid #1f2a44; }
        .log-area .log-line { padding: 2px 0; border-bottom: 1px solid #1a2335; }
        .log-area .log-line.success { color: #36d399; }
        .log-area .log-line.error { color: #ff5e5e; }
        .log-area .log-line.info { color: #4c9aff; }
        .download-area { margin: 1.8rem 0 0.5rem 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; background: rgba(0,255,200,0.02); padding: 0.8rem 1.2rem; border-radius: 40px; border: 1px solid rgba(0,255,200,0.06); }
        .download-area .file-info { color: #b0ceff; font-size: 0.9rem; display: flex; align-items: center; gap: 12px; }
        .download-area .file-info i { color: #36d399; }
        .btn-download { background: rgba(0,200,150,0.12); padding: 12px 28px; border-radius: 60px; color: #9bffe0; border: 1px solid rgba(0,255,200,0.15); font-weight: 500; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
        .btn-download:hover { background: rgba(0,255,180,0.18); color: #d0fff0; border-color: #36d399; }
        .footer-credit { margin-top: 2.5rem; text-align: center; color: #446688; font-size: 0.8rem; border-top: 1px solid rgba(255,255,255,0.02); padding-top: 1.8rem; }
        .footer-credit a { color: #6b9eff; text-decoration: none; }
        .hidden { display: none !important; }
        .tag { background: rgba(60,130,255,0.12); padding: 0.2rem 0.9rem; border-radius: 40px; color: #8bb3f0; font-size: 0.7rem; border: 1px solid rgba(60,130,255,0.08); }
        .error-text { color: #ff5e5e; }
        @media (max-width: 450px) { .input-group input { min-width: 100%; } .btn-primary { width: 100%; justify-content: center; } .download-area { flex-direction: column; align-items: stretch; text-align: center; } .btn-download { justify-content: center; } }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-code-branch"></i></div>
            <div class="logo-text">Clone<span>Bot</span></div>
            <span class="sub-badge"><i class="fas fa-server"></i> خادم حقيقي</span>
        </div>
        <div class="welcome-message">
            <i class="fas fa-robot"></i>
            <strong>بوت استنساخ المواقع - يعمل على خادم حقيقي</strong><br>
            يستخدم <strong>Playwright</strong> لتنفيذ JavaScript وتضمين جميع الموارد
            <span style="display:block; margin-top:6px; font-size:0.9rem; opacity:0.8;">
                <i class="fas fa-check-circle" style="color:#36d399;"></i> استنساخ كامل للموقع في ملف HTML واحد
            </span>
        </div>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="أدخل رابط الموقع... https://example.com" value="https://rashq10k.com">
            <button class="btn-primary" id="cloneBtn"><i class="fas fa-clone"></i> استنساخ</button>
        </div>
        <div id="statusArea" class="status-box">
            <div class="spinner hidden" id="spinner"></div>
            <div style="flex:1;">
                <div class="status-text" id="statusText"><i class="fas fa-info-circle"></i> أدخل رابط الموقع واضغط "استنساخ"</div>
                <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
            </div>
        </div>
        <div class="log-area" id="logArea">
            <div class="log-line info">📌 خادم Flask + Playwright جاهز...</div>
        </div>
        <div id="downloadArea" class="download-area hidden">
            <div class="file-info"><i class="fas fa-file-code"></i><span id="fileInfoText">clone_site.html</span><span class="tag" id="fileSizeTag">0 KB</span></div>
            <a id="downloadLink" class="btn-download" download="clone_site.html"><i class="fas fa-download"></i> تحميل الملف</a>
        </div>
        <div class="footer-credit">
            <i class="fas fa-crown" style="color:#fbbf24;"></i> <a href="#">@ISmartCoder</a> · 
            <i class="fas fa-sync-alt"></i> استنساخ كامل
        </div>
    </div>
    <script>
        (function() {
            const urlInput = document.getElementById('urlInput');
            const cloneBtn = document.getElementById('cloneBtn');
            const statusText = document.getElementById('statusText');
            const spinner = document.getElementById('spinner');
            const progressFill = document.getElementById('progressFill');
            const logArea = document.getElementById('logArea');
            const downloadArea = document.getElementById('downloadArea');
            const fileInfoText = document.getElementById('fileInfoText');
            const fileSizeTag = document.getElementById('fileSizeTag');
            const downloadLink = document.getElementById('downloadLink');

            function addLog(message, type='info') {
                const div = document.createElement('div');
                div.className = `log-line ${type}`;
                div.textContent = `> ${message}`;
                logArea.appendChild(div);
                logArea.scrollTop = logArea.scrollHeight;
            }

            function updateProgress(value) {
                progressFill.style.width = Math.min(value, 100) + '%';
            }

            async function handleClone() {
                let rawUrl = urlInput.value.trim();
                if (!rawUrl) {
                    statusText.innerHTML = `<i class="fas fa-exclamation-circle" style="color:#ff9b9b;"></i> يرجى إدخال رابط الموقع.`;
                    return;
                }

                if (!rawUrl.startsWith('http://') && !rawUrl.startsWith('https://')) {
                    rawUrl = 'https://' + rawUrl;
                }

                cloneBtn.disabled = true;
                cloneBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري...';
                spinner.classList.remove('hidden');
                downloadArea.classList.add('hidden');
                logArea.innerHTML = '';
                addLog(`🚀 بدء استنساخ: ${rawUrl}`, 'info');
                updateProgress(10);

                try {
                    const response = await fetch('/api/clone', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: rawUrl })
                    });

                    updateProgress(30);
                    addLog('⏳ جاري تحميل الصفحة وتنفيذ JavaScript...', 'info');

                    // التحقق من نوع الرد
                    const contentType = response.headers.get('content-type') || '';

                    if (!response.ok) {
                        // محاولة قراءة الخطأ كـ JSON
                        let errorMsg = `فشل الاستنساخ (${response.status})`;
                        try {
                            const errorData = await response.json();
                            if (errorData.error) {
                                errorMsg = errorData.error;
                            }
                        } catch (e) {
                            // إذا لم يكن JSON، قراءة النص
                            const text = await response.text();
                            // إزالة HTML من الرسالة
                            const plainText = text.replace(/<[^>]*>/g, '').trim();
                            if (plainText) {
                                errorMsg = plainText.substring(0, 200);
                            }
                        }
                        throw new Error(errorMsg);
                    }

                    // التحقق من أن الرد هو ملف HTML
                    if (contentType.includes('text/html')) {
                        updateProgress(80);
                        addLog('✅ تم تحميل جميع الموارد', 'success');

                        const blob = await response.blob();
                        const fileSize = (blob.size / 1024).toFixed(1);
                        const domain = new URL(rawUrl).hostname.replace('www.', '');
                        const fileName = `clone_${domain}.html`;

                        updateProgress(100);
                        addLog(`✅ اكتمل الاستنساخ! حجم الملف: ${fileSize} KB`, 'success');

                        fileInfoText.textContent = fileName;
                        fileSizeTag.textContent = `${fileSize} KB`;
                        const urlObject = URL.createObjectURL(blob);
                        downloadLink.href = urlObject;
                        downloadLink.download = fileName;
                        downloadArea.classList.remove('hidden');

                        statusText.innerHTML = `<i class="fas fa-check-circle" style="color:#36d399;"></i> ✅ تم استنساخ الموقع بنجاح!`;
                    } else {
                        // رد غير متوقع
                        const text = await response.text();
                        throw new Error(`رد غير متوقع من الخادم: ${text.substring(0, 100)}`);
                    }

                } catch (error) {
                    addLog(`❌ خطأ: ${error.message}`, 'error');
                    statusText.innerHTML = `<i class="fas fa-times-circle" style="color:#ff5e5e;"></i> ❌ فشل الاستنساخ: ${error.message}`;
                    updateProgress(0);
                } finally {
                    cloneBtn.disabled = false;
                    cloneBtn.innerHTML = '<i class="fas fa-clone"></i> استنساخ';
                    spinner.classList.add('hidden');
                }
            }

            cloneBtn.addEventListener('click', handleClone);
            urlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleClone();
            });

            addLog('📡 جاهز للاتصال بالخادم...', 'info');
        })();
    </script>
</body>
</html>
